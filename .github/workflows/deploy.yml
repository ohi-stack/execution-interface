name: Deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: docker build -t ino-platform-app .
      - name: Security scan placeholder
        run: npm audit --audit-level=high
      - name: Deploy placeholder
        run: echo "Deploy image to app.indigenousnations.org container runtime"
      - name: Post-deployment health check
        run: curl --fail --retry 5 https://app.indigenousnations.org/api/health
