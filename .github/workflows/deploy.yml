name: Deploy
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APP_CANONICAL_URL: https://app.onegodian.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: docker build -t onegodian-app .
      - name: Security scan
        run: npm audit --audit-level=high
      - name: Deployment handoff
        run: |
          echo "Build is ready for the configured production provider."
          echo "Canonical target: ${APP_CANONICAL_URL}"
          echo "This workflow does not claim provider deployment unless a real deployment action is configured."
      - name: Canonical live health check
        continue-on-error: true
        run: |
          curl --fail --retry 5 --max-time 20 "${APP_CANONICAL_URL}/api/health"
