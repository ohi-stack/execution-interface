name: Deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Validate OneGodian Members PHP syntax
        run: find onegodian-members -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: npm ci
      - run: npm run test:members
      - run: npm run build
      - run: docker build -t onegodian-app .
      - name: Security scan
        run: npm audit --audit-level=high
      - name: Deployment handoff
        run: echo "Build is ready for the configured app.OneGodian.com runtime deployment provider. Configure the provider-specific deployment action/secret before treating this workflow as a completed redeploy."
      - name: Live health verification
        continue-on-error: true
        run: curl --fail --retry 5 https://app.onegodian.com/api/health
