version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    container_name: acc-api-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: acc_api
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d acc_api']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
