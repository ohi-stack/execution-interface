openapi: 3.0.3
info:
  title: ACC API Authority Endpoints
  version: 0.1.0
servers:
  - url: http://localhost:3000
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service health
  /api/v1/authority/model:
    get:
      summary: Get authority model
      responses:
        '200':
          description: Authority model
  /api/v1/authorize:
    post:
      summary: Evaluate authorization request and persist decision log record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizeRequest'
      responses:
        '200':
          description: Allowed decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionRecord'
        '202':
          description: Approval required decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionRecord'
        '400':
          description: Invalid request payload
        '403':
          description: Prohibited decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionRecord'
  /api/v1/decisions:
    get:
      summary: List recent decision records
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Decision list
  /api/v1/decisions/{decisionId}:
    get:
      summary: Get decision by id
      parameters:
        - in: path
          name: decisionId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Decision record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionRecord'
        '404':
          description: Not found
components:
  schemas:
    AuthorizeRequest:
      type: object
      required: [actorType, actorId, role, action]
      properties:
        actorType:
          type: string
        actorId:
          type: string
        role:
          type: string
        action:
          type: string
        requestId:
          type: string
    DecisionRecord:
      type: object
      required:
        - decisionId
        - actorType
        - actorId
        - role
        - action
        - decision
        - reason
        - approvalStatus
        - timestampUtc
        - requestId
      properties:
        decisionId:
          type: string
        actorType:
          type: string
        actorId:
          type: string
        role:
          type: string
        action:
          type: string
        decision:
          type: string
          enum: [allow, deny, approval_required]
        reason:
          type: string
        approvalStatus:
          type: string
          enum: [not_required, required, approved, rejected]
        timestampUtc:
          type: string
          format: date-time
        requestId:
          type: string
