<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Issuer Portal</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 720px;
        margin: 0 auto;
        padding: 32px 16px;
        color: #1f2933;
        background: #f8fafc;
      }

      h1 {
        margin-bottom: 24px;
      }

      form {
        background: #ffffff;
        border: 1px solid #d9e2ec;
        border-radius: 8px;
        padding: 24px;
      }

      .field {
        margin-bottom: 16px;
      }

      label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
      }

      input,
      select,
      textarea,
      button {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #bcccdc;
        border-radius: 6px;
        box-sizing: border-box;
        font: inherit;
      }

      textarea {
        min-height: 120px;
        resize: vertical;
      }

      button {
        border: none;
        background: #2563eb;
        color: #ffffff;
        font-weight: 600;
        cursor: pointer;
      }

      button:disabled {
        background: #9fb3c8;
        cursor: wait;
      }

      .result {
        display: none;
        margin-top: 24px;
        padding: 20px;
        border-radius: 8px;
        background: #ffffff;
        border: 1px solid #d9e2ec;
      }

      .result img {
        display: block;
        width: 220px;
        max-width: 100%;
        margin-top: 16px;
      }

      .message {
        margin-top: 16px;
        font-size: 0.95rem;
      }

      .message.error {
        color: #b42318;
      }

      .message.success {
        color: #027a48;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Issuer Portal</h1>
      <form id="issuer-form">
        <div class="field">
          <label for="assetName">Asset Name</label>
          <input id="assetName" name="assetName" type="text" required />
        </div>

        <div class="field">
          <label for="recordType">Record Type</label>
          <select id="recordType" name="recordType" required>
            <option value="">Select a record type</option>
            <option value="certificate">Certificate</option>
            <option value="license">License</option>
            <option value="credential">Credential</option>
          </select>
        </div>

        <div class="field">
          <label for="issuerName">Issuer Name</label>
          <input id="issuerName" name="issuerName" type="text" required />
        </div>

        <div class="field">
          <label for="description">Description</label>
          <textarea id="description" name="description" required></textarea>
        </div>

        <button id="submit-button" type="submit">Generate QR-V Code</button>
        <p id="status-message" class="message" aria-live="polite"></p>
      </form>

      <section id="result" class="result" aria-live="polite">
        <h2>Generated Result</h2>
        <p><strong>QR-V ID:</strong> <span id="qrvid-text"></span></p>
        <img id="qr-image" alt="Generated QR code" />
      </section>
    </main>

    <script>
      const form = document.getElementById('issuer-form');
      const submitButton = document.getElementById('submit-button');
      const statusMessage = document.getElementById('status-message');
      const resultSection = document.getElementById('result');
      const qrvidText = document.getElementById('qrvid-text');
      const qrImage = document.getElementById('qr-image');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();

        const payload = {
          assetName: document.getElementById('assetName').value.trim(),
          recordType: document.getElementById('recordType').value,
          issuer: document.getElementById('issuerName').value.trim(),
          description: document.getElementById('description').value.trim(),
        };

        submitButton.disabled = true;
        statusMessage.textContent = 'Generating QR-V Code...';
        statusMessage.className = 'message';
        resultSection.style.display = 'none';

        try {
          const response = await fetch('http://localhost:3000/registry/create', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify(payload),
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || 'Failed to generate QR-V Code.');
          }

          const qrvid = data.qrvid || data.qrVId || data.id;
          const qrCodeImage = data.qrCodeImage || data.qrCode || data.qrImage;

          if (!qrvid || !qrCodeImage) {
            throw new Error('The API response is missing the QR-V ID or QR code image.');
          }

          qrvidText.textContent = qrvid;
          qrImage.src = qrCodeImage;
          resultSection.style.display = 'block';
          statusMessage.textContent = 'QR-V Code generated successfully.';
          statusMessage.className = 'message success';
        } catch (error) {
          statusMessage.textContent = error.message;
          statusMessage.className = 'message error';
        } finally {
          submitButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
