name: CI

on:
  push:
    paths:
      - 'ohi-stack/onegodian-api/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'ohi-stack/onegodian-api/**'
      - '.github/workflows/ci.yml'

jobs:
  build-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ohi-stack/onegodian-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ohi-stack/onegodian-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
