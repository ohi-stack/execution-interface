name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ohi-stack/onegodian-api/package-lock.json

      - name: Install dependencies
        working-directory: ohi-stack/onegodian-api
        run: npm ci

      - name: Type check
        working-directory: ohi-stack/onegodian-api
        run: npm run check

      - name: Run tests
        working-directory: ohi-stack/onegodian-api
        run: npm run test

      - name: Build
        working-directory: ohi-stack/onegodian-api
        run: npm run build
