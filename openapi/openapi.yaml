{
  "openapi": "3.0.3",
  "info": {
    "title": "QRV Certificate Verification API v1",
    "version": "1.2.0",
    "description": "Production create/verify/revoke and provisioning endpoints for QRV certificate-first scope."
  },
  "servers": [
    {
      "url": "/api/v1"
    }
  ],
  "paths": {
    "/registry/create": {
      "post": {
        "summary": "Create a certificate record",
        "security": [
          {
            "ApiKeyAuth": []
          }
        ],
        "responses": {
          "201": {
            "description": "Record created"
          },
          "400": {
            "$ref": "#/components/responses/ErrorResponse"
          },
          "403": {
            "$ref": "#/components/responses/ErrorResponse"
          },
          "409": {
            "$ref": "#/components/responses/ErrorResponse"
          }
        }
      }
    },
    "/verify/{qrvid}": {
      "get": {
        "summary": "Verify a certificate by QRVID",
        "parameters": [
          {
            "name": "qrvid",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Verification result"
          },
          "404": {
            "description": "Record not found"
          },
          "429": {
            "$ref": "#/components/responses/ErrorResponse"
          }
        }
      }
    },
    "/revoke": {
      "post": {
        "summary": "Revoke a certificate",
        "security": [
          {
            "ApiKeyAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Record revoked"
          },
          "400": {
            "$ref": "#/components/responses/ErrorResponse"
          },
          "403": {
            "$ref": "#/components/responses/ErrorResponse"
          },
          "404": {
            "$ref": "#/components/responses/ErrorResponse"
          }
        }
      }
    },
    "/admin/issuers": {
      "post": {
        "summary": "Provision issuer",
        "security": [
          {
            "BearerAuth": []
          }
        ],
        "responses": {
          "201": {
            "description": "Issuer provisioned"
          }
        }
      }
    },
    "/admin/api-keys": {
      "post": {
        "summary": "Provision issuer API key",
        "security": [
          {
            "BearerAuth": []
          }
        ],
        "responses": {
          "201": {
            "description": "API key provisioned"
          }
        }
      }
    },
    "/billing/plans": {
      "get": {
        "summary": "List subscription plans",
        "responses": {
          "200": {
            "description": "Plan catalog"
          }
        }
      }
    },
    "/billing/checkout": {
      "post": {
        "summary": "Create Stripe checkout session",
        "responses": {
          "201": {
            "description": "Checkout created"
          }
        }
      }
    },
    "/billing/{issuer_id}/status": {
      "get": {
        "summary": "Get issuer subscription status",
        "parameters": [
          {
            "name": "issuer_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Subscription status"
          }
        }
      }
    },
    "/onboarding/signup": {
      "post": {
        "summary": "Create issuer account",
        "responses": {
          "201": {
            "description": "Issuer created"
          }
        }
      }
    },
    "/onboarding/verify-email": {
      "post": {
        "summary": "Verify issuer email token",
        "responses": {
          "200": {
            "description": "Verified"
          }
        }
      }
    },
    "/authority/model": {
      "get": {
        "summary": "Get authority model metadata",
        "responses": {
          "200": {
            "description": "Authority model"
          }
        }
      }
    },
    "/authorize": {
      "post": {
        "summary": "Authorize an action and persist decision record",
        "responses": {
          "200": {
            "description": "Authorized"
          },
          "403": {
            "description": "Denied"
          }
        }
      }
    },
    "/decisions/{decisionId}": {
      "get": {
        "summary": "Fetch authority decision record by ID",
        "parameters": [
          {
            "name": "decisionId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Decision record"
          },
          "404": {
            "description": "Not found"
          }
        }
      }
    },
    "/decisions": {
      "get": {
        "summary": "List authority decision records",
        "parameters": [
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Decision list"
          }
        }
      }
    },
    "/kill-switch": {
      "get": {
        "summary": "Get kill-switch status",
        "responses": {
          "200": {
            "description": "Kill switch state"
          }
        }
      }
    },
    "/kill-switch/global": {
      "post": {
        "summary": "Set global kill switch",
        "responses": {
          "200": {
            "description": "Updated state"
          }
        }
      }
    },
    "/kill-switch/domain/{domain}": {
      "post": {
        "summary": "Set domain kill switch",
        "parameters": [
          {
            "name": "domain",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Updated state"
          }
        }
      }
    },
    "/kill-switch/agent/{agentId}": {
      "post": {
        "summary": "Set agent kill switch",
        "parameters": [
          {
            "name": "agentId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Updated state"
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "ApiKeyAuth": {
        "type": "apiKey",
        "in": "header",
        "name": "x-api-key"
      },
      "BearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT"
      }
    },
    "responses": {
      "ErrorResponse": {
        "description": "Structured machine-readable error"
      }
    },
    "schemas": {
      "VerifyResponse": {
        "type": "object",
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "VERIFIED",
              "REVOKED",
              "EXPIRED",
              "NOT_FOUND",
              "INVALID_SIGNATURE",
              "ERROR"
            ]
          }
        }
      },
      "DecisionRecord": {
        "type": "object",
        "required": [
          "decisionId",
          "action",
          "decision",
          "approvalStatus",
          "timestampUtc"
        ],
        "properties": {
          "decisionId": {
            "type": "string"
          },
          "executionId": {
            "type": "string",
            "nullable": true
          },
          "workflowId": {
            "type": "string",
            "nullable": true
          },
          "tenantId": {
            "type": "string",
            "nullable": true
          },
          "actorType": {
            "type": "string"
          },
          "actorId": {
            "type": "string"
          },
          "agentId": {
            "type": "string",
            "nullable": true
          },
          "role": {
            "type": "string"
          },
          "action": {
            "type": "string"
          },
          "resource": {
            "type": "string",
            "nullable": true
          },
          "environment": {
            "type": "string"
          },
          "authorityScope": {
            "type": "object"
          },
          "policyId": {
            "type": "string",
            "nullable": true
          },
          "policyHash": {
            "type": "string",
            "nullable": true
          },
          "inputHash": {
            "type": "string",
            "nullable": true
          },
          "outputHash": {
            "type": "string",
            "nullable": true
          },
          "riskLevel": {
            "type": "string"
          },
          "decision": {
            "type": "string",
            "enum": [
              "allow",
              "deny"
            ]
          },
          "reason": {
            "type": "string"
          },
          "approvalStatus": {
            "type": "string"
          },
          "approvalLevel": {
            "type": "string",
            "nullable": true
          },
          "requestId": {
            "type": "string"
          },
          "timestampUtc": {
            "type": "string",
            "format": "date-time"
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      }
    }
  }
}
