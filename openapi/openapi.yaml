{
  "openapi": "3.0.3",
  "info": {
    "title": "QRV Certificate Verification API v1",
    "version": "1.2.0",
    "description": "Production create/verify/revoke and provisioning endpoints for QRV certificate-first scope."
  },
  "servers": [
    {
      "url": "/api/v1"
    }
  ],
  "paths": {
    "/registry/create": {
      "post": {
        "summary": "Create a certificate record",
        "security": [
          {
            "ApiKeyAuth": []
          }
        ],
        "responses": {
          "201": {
            "description": "Record created"
          },
          "400": {
            "$ref": "#/components/responses/ErrorResponse"
          },
          "403": {
            "$ref": "#/components/responses/ErrorResponse"
          },
          "409": {
            "$ref": "#/components/responses/ErrorResponse"
          }
        }
      }
    },
    "/verify/{qrvid}": {
      "get": {
        "summary": "Verify a certificate by QRVID",
        "parameters": [
          {
            "name": "qrvid",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Verification result"
          },
          "404": {
            "description": "Record not found"
          },
          "429": {
            "$ref": "#/components/responses/ErrorResponse"
          }
        }
      }
    },
    "/revoke": {
      "post": {
        "summary": "Revoke a certificate",
        "security": [
          {
            "ApiKeyAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Record revoked"
          },
          "400": {
            "$ref": "#/components/responses/ErrorResponse"
          },
          "403": {
            "$ref": "#/components/responses/ErrorResponse"
          },
          "404": {
            "$ref": "#/components/responses/ErrorResponse"
          }
        }
      }
    },
    "/admin/issuers": {
      "post": {
        "summary": "Provision issuer",
        "security": [
          {
            "BearerAuth": []
          }
        ],
        "responses": {
          "201": {
            "description": "Issuer provisioned"
          }
        }
      }
    },
    "/admin/api-keys": {
      "post": {
        "summary": "Provision issuer API key",
        "security": [
          {
            "BearerAuth": []
          }
        ],
        "responses": {
          "201": {
            "description": "API key provisioned"
          }
        }
      }
    },
    "/billing/plans": {
      "get": {
        "summary": "List subscription plans",
        "responses": {
          "200": {
            "description": "Plan catalog"
          }
        }
      }
    },
    "/billing/checkout": {
      "post": {
        "summary": "Create Stripe checkout session",
        "responses": {
          "201": {
            "description": "Checkout created"
          }
        }
      }
    },
    "/billing/{issuer_id}/status": {
      "get": {
        "summary": "Get issuer subscription status",
        "parameters": [
          {
            "name": "issuer_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Subscription status"
          }
        }
      }
    },
    "/onboarding/signup": {
      "post": {
        "summary": "Create issuer account",
        "responses": {
          "201": {
            "description": "Issuer created"
          }
        }
      }
    },
    "/onboarding/verify-email": {
      "post": {
        "summary": "Verify issuer email token",
        "responses": {
          "200": {
            "description": "Verified"
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "ApiKeyAuth": {
        "type": "apiKey",
        "in": "header",
        "name": "x-api-key"
      },
      "BearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT"
      }
    },
    "responses": {
      "ErrorResponse": {
        "description": "Structured machine-readable error"
      }
    },
    "schemas": {
      "VerifyResponse": {
        "type": "object",
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "VERIFIED",
              "REVOKED",
              "EXPIRED",
              "NOT_FOUND",
              "INVALID_SIGNATURE",
              "ERROR"
            ]
          }
        }
      }
    }
  }
}