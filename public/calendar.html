<!DOCTYPE html><html><head><title>Onegodian Calendar</title><style>body{font-family:sans-serif;background:#020617;color:white}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}.cell{padding:15px;border:1px solid #334155}</style></head><body><h1>Onegodian Calendar</h1><div id="status">Loading...</div><div class="grid" id="calendar"></div><script>
async function load(){await fetch('/api/calendar/config').then(r=>r.json());const now=await fetch('/api/calendar/now').then(r=>r.json());const events=await fetch('/api/scheduler/events').then(r=>r.json()).catch(()=>[]);document.getElementById('status').innerHTML=`${now.ot.display} | ${now.dayOrder.name}`;const grid=document.getElementById('calendar');grid.innerHTML='';function countEvents(date){return events.filter(e=>e.gregorianDate===date).length;}const today=new Date();for(let i=0;i<30;i++){const d=new Date(Date.UTC(today.getUTCFullYear(),today.getUTCMonth(),1+i));const date=d.toISOString().slice(0,10);const res=await fetch(`/api/calendar/convert?date=${date}`);const data=await res.json();const div=document.createElement('div');div.className='cell';div.innerHTML=`<strong>${data.ot.day}</strong><br>${data.dayOrder.name}<br><small>${data.gregorianDate}</small><div>${countEvents(date)} events</div>`;grid.appendChild(div);}}
load();</script></body></html>
